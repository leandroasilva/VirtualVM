name: Checks

on:
  pull_request:
    branches: [main]
  # The same checks again on main itself, so a merge window can't leave it broken unseen.
  push:
    branches: [main]
  # And once a week at a quiet hour, for rot in the toolchain or in dependencies.
  schedule:
    - cron: "17 3 * * 6"

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    # The app needs the macOS 27 SDK, which this image has.
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore SPM cache
        id: spm-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-${{ runner.arch }}-

      - name: Build
        env:
          VIRTUALVM_SIGN_IDENTITY: "-"
          VIRTUALVM_PROVISIONING_PROFILE: "-"
        run: scripts/build.sh --output "$RUNNER_TEMP/VirtualVM.app"

      - name: Test
        run: scripts/test.sh

      - name: Save SPM cache
        if: always() && steps.spm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: ${{ steps.spm-cache.outputs.cache-primary-key }}
